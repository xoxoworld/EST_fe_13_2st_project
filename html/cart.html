        <!-- 배너 -->
        <section class="cart-banner swiper">
          <div class="swiper-wrapper">
            <div class="swiper-slide">
              <img src="../assets/images/cart_banner1.png" alt="베너 사진">
            </div>

            <div class="swiper-slide">
              <img src="../assets/images/cart_banner2.png" alt="배너 사진">

          <div class="swiper-pagination"></div>

      <!-- 오른쪽 -->

        <!-- 구매 예상 혜택 -->
        <section class="benefit-summary  d-flex flex-column g-10">
          <h3>구매 예상 혜택</h3>

      </div>
      <div class="swiper recommend-swiper">

        <div class="swiper-button-prev recommend-prev"></div>
        <div class="swiper-button-next recommend-next"></div>
      </div>
    </section>

    <!-- 당신을 위한 컬렉션 -->
    <section class="collection-section d-flex flex-column">
      <div class="section-header d-flex justify-content-between">
