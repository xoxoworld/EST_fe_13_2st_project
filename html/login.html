<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ROUNZ 로그인 화면</title>

    <link rel="stylesheet" href="../css/normalize.css" />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/flex-utility.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/sign.css" />
    <link rel="stylesheet" href="../css/login.css" />

    <script type="module" src="../js/pages/login.js" defer></script>
  </head>

  <body class="d-flex flex-column min-vh-100">
    <div id="app-container">
      <header class="header container d-flex align-items-center"></header>

      <!-- 💡 [수정] flex-grow-1 추가 및 불필요한 레이아웃 간섭 제거 -->
      <main class="main-layout flex-grow-1">
        <section class="auth-wrapper">
          <div class="login-section">
            <div class="login-header">
              <h2 class="logo">ROUNZ</h2>
              <p>세상에 없던 안경 쇼핑</p>
            </div>

            <!-- 💡 [수정] 1번 로그인 화면 전용 가로 구분선 추가 -->
            <div class="header-underline"></div>

            <div class="page-title-box">
              <h2 class="text-subtitle-xl">로그인</h2>
            </div>

            <form id="login-form" action="/login-process" method="POST">
              <div class="input-group">
                <input
                  type="text"
                  id="useremail"
                  name="useremail"
                  placeholder="example@gmail.com"
                />
                <input
                  type="password"
                  id="userpassword"
                  name="userpassword"
                  placeholder="비밀번호 입력"
                />
              </div>

              <nav class="text-links" aria-label="계정 메뉴">
                <a href="#">아이디 찾기</a>
                <a href="#">비밀번호 찾기</a>
                <a href="signup.html">회원가입</a>
              </nav>

              <div class="divider"><span>또는</span></div>

              <div class="social-group" id="social-container"></div>

              <button type="submit" class="primary-btn" id="login-btn">로그인</button>
            </form>
          </div>
        </section>
      </main>

      <footer class="footer">
        <div class="footer-inner">
          <div class="footer-top">
            <a href="#" class="store-link">라운즈 플래그십 스토어</a>
            <span class="vertical-bar">|</span>
            <a href="#" class="store-link">라운즈 파트너 안경원</a>
          </div>

          <div class="footer-bottom">
            <div class="company-info">
              <h2 class="footer-logo">ROUNZ</h2>
              <address class="address-text">
                상호명 : 주식회사 라운즈 | 대표 : 홍길동<br />
                사업자등록번호 : 123-45-67890 | 통신판매업 신고 : 2024-서울강남-0000호<br />
                사업자 주소 : 서울특별시 강남구 테헤란로 |
                <span class="policy-bold">개인정보처리방침</span>
              </address>
              <p class="copyright">&copy;ROUNZ</p>
            </div>

            <div class="footer-links">
              <a href="#">라운즈앱</a> | <a href="#">라운즈 해외</a> |
              <a href="#">라운즈 파트너스</a> | <a href="#">글라스박스</a> |
              <a href="#">가맹문의</a> | <a href="#">사업자 정보확인</a>
            </div>

            <ul class="social-links">
              <li><img src="../assets/icons/bg_blog.png" alt="블로그" /></li>
              <li><img src="../assets/icons/bg_fb.png" alt="페이스북" /></li>
              <li><img src="../assets/icons/bg_insta.png" alt="인스타그램" /></li>
              <li><img src="../assets/icons/btn_kcp.png" alt="KCP" /></li>
            </ul>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
