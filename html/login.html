<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ROUNZ 로그인 화면</title>

    <link rel="stylesheet" href="../css/normalize.css" />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/flex-utility.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/sign.css" />
    <link rel="stylesheet" href="../css/login.css" />

    <!-- 검사 defer 오류 -->
    <script type="module" src="../js/pages/login.js" defer></script>
  </head>

  <body class="d-flex flex-column min-vh-100">
    <div id="app-container">
      <header class="header container d-flex align-items-center"></header>

      <!-- 💡 [수정] flex-grow-1 추가 및 불필요한 레이아웃 간섭 제거 -->
      <main class="auth-container flex-grow-1">
        <section class="auth-wrapper">
          <div class="login-section">
            <div class="login-header">
              <h2 class="logo">ROUNZ</h2>
              <p>세상에 없던 안경 쇼핑</p>
            </div>

            <!-- 💡 [수정] 1번 로그인 화면 전용 가로 구분선 추가 -->
            <div class="header-underline"></div>

            <div class="page-title-box">
              <h2 class="text-subtitle-xl">로그인</h2>
            </div>

            <form id="login-form">
              <div class="input-group">
                <input
                  type="text"
                  id="useremail"
                  name="useremail"
                  placeholder="example@gmail.com"
                />
                <span class="error-message" id="email-error">이메일을 입력해주세요.</span>

                <input
                  type="password"
                  id="userpassword"
                  name="userpassword"
                  placeholder="비밀번호 입력"
                />
                <span class="error-message" id="password-error">비밀번호를 입력해주세요.</span>
              </div>

              <nav class="text-links" aria-label="계정 메뉴">
                <a href="#">아이디 찾기</a>
                <a href="#">비밀번호 찾기</a>
                <a href="signup.html">회원가입</a>
              </nav>

              <div class="divider"><span>또는</span></div>

              <div class="social-group" id="social-container"></div>

              <button type="submit" id="login-btn" class="primary-btn">로그인</button>
            </form>
          </div>
        </section>
      </main>

      <footer class="footer"></footer>
    </div>
  </body>
</html>
