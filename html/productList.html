<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 목록</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=favorite" />
  <link rel="stylesheet" href="../css/common.css" />

<body>
  <header></header>
  <main class="container product-list-page">
    <section class="breadcrumb-section">
      <nav class="breadcrumb d-flex align-items-center">
        <a href="../index.html" class="material-icons home">home</a>
        <span class="material-icons chevron_right">chevron_right</span>
        <span class="breadcrumb-home">선글라스</span>
      </nav>
    </section>

    <!-- 상위 배너 -->
    <section class="promotion d-flex flex-column g-16">
      <div class="promotion-text d-flex flex-column">
        <h2 class="text-medium-b">선글라스</h2>
        <div class="d-flex flex-column">
          <p class="text-small-r">자외선으로부터 안전하게,</p>
          <p class="text-small-r">스타일은 더 멋지게</p>
        </div>
      </div>
      <div class="promotion-card d-flex">
        <a href="#" class="w-card">
          <img src="../assets/images/promotion-card_1.webp" alt="홍보 배너 이미지" />
          <div class="card-text d-flex flex-column">
            <p class="text-small-b">NEW</p>
            <p class="card-sub-text text-small-m">2026 여름 신상 선글라스</p>
            <div class="promotion-link d-flex align-items-center">
              <span class="chevron_right">더보기</span>
              <span class="material-icons chevron_right">
                chevron_right
              </span>
            </div>
          </div>
        </a>
        <a href="#" class="w-card">
          <img src="../assets/images/promotion-card_3.webp" alt="홍보 배너 이미지" />
          <div class="card-text d-flex flex-column">
            <p class="text-small-b">BEST</p>
            <p class="card-sub-text text-small-m">지금 많이 선택한 선글라스</p>
            <div class="promotion-link d-flex align-items-center">
              <span class="chevron_right">더보기</span>
              <span class="material-icons chevron_right">
                chevron_right
              </span>
            </div>
          </div>
        </a>
        <a href="#" class="w-card">
          <img src="../assets/images/promotion-card_2.webp" alt="홍보 배너 이미지" />
          <div class="card-text d-flex flex-column">
            <p class="text-small-b">AI</p>
            <p class="card-sub-text text-small-m">내 얼굴에 맞는 선글라스</p>
            <div class="promotion-link d-flex align-items-center">
              <span class="chevron_right">더보기</span>
              <span class="material-icons chevron_right">
                chevron_right
              </span>
            </div>
          </div>
        </a>
      </div>
    </section>

    <!-- 왼쪽 필터 -->
    <section class="product-layout">
      <aside class="filter-sidebar d-flex">
        <h3 class="filter-sidebar-title text-subtitle-m">필터</h3>

        <!-- 카테고리 -->
        <div class="filter-group category d-flex flex-column g-20">
          <p class="filter-sub-title text-subtitle-xs">카테고리</p>
          <ul class="filter-list text-medium-r">
            <li class="filter-item">
              <label>
                <input type="checkbox" value="all">
                <span>전체</span>
              </label>
            </li>
            <li class="filter-item">
              <label>
                <input type="checkbox" value="sunglasses">
                <span>선글라스</span>
              </label>
            </li>
            <li class="filter-item">
              <label>
                <input type="checkbox" value="glasses">
                <span>안경</span>
              </label>
            </li>
            <li class="filter-item">
              <label>
                <input type="checkbox" value="goggle">
                <span>스포츠 고글</span>
              </label>
            </li>
          </ul>
        </div>

        <!-- 브랜드 -->
        <div class="filter-group brand d-flex flex-column g-20">
          <p class="filter-sub-title text-subtitle-xs">브랜드</p>
          <input type="text" class="brand-search text-small-m" placeholder="브랜드 검색" />
          <ul class="filter-list text-medium-r">
            <li class="filter-item">
              <label>
                <input type="checkbox" value="Ray-Ban">
                <span>레이밴 (Ray-Ban)</span>
                <span class="brand-count">(132)</span>
              </label>
            </li>
            <li class="filter-item">
              <label>
                <input type="checkbox" value="OAKLEY">
                <span>오클리 (OAKLEY)</span>
                <span class="brand-count">(122)</span>
              </label>
            </li>
            <li class="filter-item">
              <label>
                <input type="checkbox" value="LE SPECS">
                <span>르스펙스 (LE SPECS)</span>
                <span class="brand-count">(12)</span>
              </label>
            </li>

            <!-- 더보기 누르면 나오는 리스트 -->
            <li class="filter-item hidden-item">
              <label>
                <input type="checkbox" value="FAKEME">
                <span>페이크미 (FAKEME)</span>
                <span class="brand-count">(97)</span>
              </label>
            </li>
            <li class="filter-item hidden-item">
              <label>
                <input type="checkbox" value="YELLOW BEE">
                <span>옐로우비 (YELLOW BEE)</span>
                <span class="brand-count">(13)</span>
              </label>
            </li>
          </ul>
          <button type="button" class="f-more-btn text-small-m">더보기 +</button>
        </div>

        <!-- 프레임 형태 -->
        <div class="filter-group frame-shape d-flex flex-column g-20">
          <p class="filter-sub-title text-subtitle-xs">프레임 형태</p>
          <ul class="filter-list text-medium-r">
            <li class="filter-item">
              <label>
                <img src="../assets/images/shape_round.png" class="shape-img" data-shape="round" alt="라운드 프레임">
                <span>라운드</span>
                <span class="brand-count">(378)</span>
              </label>
            </li>
            <li class="filter-item">
              <label>
                <img src="../assets/images/shape_square.png" class="shape-img" data-shape="square" alt="스퀘어 프레임">
                <span>스퀘어</span>
                <span class="brand-count">(859)</span>
              </label>
            </li>

            <!-- 더보기 누르면 나오는 리스트 -->
            <li class="filter-item hidden-item">
              <label>
                <img src="../assets/images/shape_browline.png" class="shape-img" data-shape="browline" alt="하금테 프레임">
                <span>하금테</span>
                <span class="brand-count">(76)</span>
              </label>
            </li>
            <li class="filter-item hidden-item">
              <label>
                <img src="../assets/images/shape_goggle.png" class="shape-img" data-shape="goggle" alt="고글 프레임">

                <span class="brand-count">(221)</span>
              </label>
            </li>
            <li class="filter-item hidden-item">
              <label>
                <img src="../assets/images/shape_mixed.png" class="shape-img" data-shape="mixed" alt="믹스 프레임">

            <li class="filter-item hidden-item">

                <span class="brand-count">(96)</span>

            <li class="filter-item hidden-item">

                <span>기타</span>
                <span class="brand-count">(5)</span>
              </label>
            </li>
          </ul>
          <button type="button" class="f-more-btn text-small-m">더보기 +</button>
        </div>

        <div class="filter-group price-range d-flex flex-column g-20">

            가격대

          <input type="range" min="0" max="500000" value="200000">
          <div class="price-label text-medium-r">
            <span class="current-price">200,000원</span>
          </div>
        </div>

        <div class="filter-group lens-color d-flex flex-column g-20">
          <p class="filter-sub-title text-subtitle-xs">색상</p>

          <ul class="filter-list text-medium-r">
            <li class="filter-item">
              <label>
                <input type="checkbox" value="블랙">

              </label>
            </li>

            <li class="filter-item">
              <label>
                <input type="checkbox" value="브라운">

            더보기 +

        </div>

        <div class="filter-group gender d-flex flex-column g-20">

            </li>
            <li class="filter-item">
              <label>

              </label>
            </li>
            <li class="filter-item">
              <label>

              </label>
            </li>
            <li class="filter-item">
              <label>
                <input type="checkbox" value="unisex">

              </label>
            </li>
          </ul>
        </div>

            <div class="ai-filter-text d-flex flex-column g-20">
              <p class="text-subtitle-m">AI 추천필터</p>
              <div class="text-large-r d-flex flex-column g-5">

            </div>

            <a href="#" class="ai-filter-link text-medium-b d-flex justify-content-center align-items-center">
              AI 추천 받기 →
            </a>
          </div>
        </div>
      </aside>
